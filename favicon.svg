<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a0a0a"/>
  <!-- Body -->
  <ellipse cx="32" cy="35" rx="11" ry="14" fill="#f5a800"/>
  <!-- Stripes -->
  <rect x="21" y="31" width="22" height="4" fill="#0a0a0a" rx="1"/>
  <rect x="21" y="38" width="22" height="4" fill="#0a0a0a" rx="1"/>
  <!-- Head -->
  <circle cx="32" cy="20" r="8" fill="#f5a800"/>
  <!-- Eyes -->
  <circle cx="29" cy="19" r="1.5" fill="#0a0a0a"/>
  <circle cx="35" cy="19" r="1.5" fill="#0a0a0a"/>
  <!-- Antennae -->
  <line x1="29" y1="13" x2="24" y2="7" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="13" x2="40" y2="7" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="24" cy="7" r="2" fill="#f5a800" stroke="#0a0a0a" stroke-width="1"/>
  <circle cx="40" cy="7" r="2" fill="#f5a800" stroke="#0a0a0a" stroke-width="1"/>
  <!-- Wings -->
  <ellipse cx="18" cy="28" rx="9" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(-20 18 28)"/>
  <ellipse cx="46" cy="28" rx="9" ry="5" fill="rgba(255,255,255,0.35)" transform="rotate(20 46 28)"/>
  <ellipse cx="17" cy="35" rx="7" ry="4" fill="rgba(255,255,255,0.25)" transform="rotate(-10 17 35)"/>
  <ellipse cx="47" cy="35" rx="7" ry="4" fill="rgba(255,255,255,0.25)" transform="rotate(10 47 35)"/>
  <!-- Stinger -->
  <polygon points="32,49 29,56 35,56" fill="#c98b00"/>
</svg>
